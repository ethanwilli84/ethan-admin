name: Social Publisher

on:
  # Runs every 15 minutes — API route checks if anything is due right now
  # in a ±30/+5 min window. Local Mac LaunchAgent is DISABLED so this is the
  # sole publisher; do not re-enable the local cron without disabling this one
  # (they will race and double-post — happened 2026-05-27).
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'post | reel | story | all'
        default: 'all'
        required: true
      account:
        description: 'sire-ship | sire-app | michigan-hype | all'
        default: 'all'
        required: true
      dry_run:
        description: 'true = preview only'
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run publisher
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          ACCOUNT="${{ github.event.inputs.account || 'all' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          echo "mode=$MODE account=$ACCOUNT dry_run=$DRY_RUN time=$(date -u)"

          if [ "$ACCOUNT" = "all" ]; then
            ACCOUNTS="sire-ship sire-app michigan-hype"
          else
            ACCOUNTS="$ACCOUNT"
          fi

          FAIL=0
          for ACC in $ACCOUNTS; do
            echo "--- $ACC ---"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "${{ secrets.ADMIN_URL }}/api/social/publish" \
              -H "Content-Type: application/json" \
              -d "{\"mode\":\"$MODE\",\"accountId\":\"$ACC\",\"dryRun\":$DRY_RUN}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -1)
            echo "$ACC HTTP $HTTP_CODE: $BODY"
            [ "$HTTP_CODE" = "200" ] || FAIL=1
          done

          exit $FAIL
