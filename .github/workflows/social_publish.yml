name: Social Publisher

on:
  # CRON DISABLED 2026-05-27 — was racing the local Mac LaunchAgent
  # (~/scripts/social/api_scheduler.py), causing duplicate posts (e.g. 6 sire-ship
  # stories instead of 3 on 2026-05-27). Local cron is now the sole publisher.
  # Re-enable here ONLY if the local LaunchAgent is also disabled.
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'post | reel | story | all'
        default: 'all'
        required: true
      dry_run:
        description: 'true = preview only'
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run publisher
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          echo "mode=$MODE dry_run=$DRY_RUN time=$(date -u)"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.ADMIN_URL }}/api/social/publish" \
            -H "Content-Type: application/json" \
            -d "{\"mode\":\"$MODE\",\"accountId\":\"sire-ship\",\"dryRun\":$DRY_RUN}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE: $BODY"

          [ "$HTTP_CODE" = "200" ] || exit 1
